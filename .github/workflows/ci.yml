name: Linux validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: |
          for script in mail-radar miab-radar install.sh; do
            bash -n "$script"
          done
      - name: ShellCheck
        run: shellcheck mail-radar miab-radar install.sh
      - name: Development checks and real dig
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dnsutils
          dig -v
          ruff check mailradar tests
      - name: Fixtures, 14 workflow launchers, read-only boundary and staged installation
        run: python -m unittest discover -s tests -v
