<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">MailRadar — follow the evidence</title>
  <desc id="desc">A cyan radar and gold MailRadar wordmark on a dark terminal-inspired background. Local mail delivery diagnostics for Mail-in-a-Box, Postfix and Dovecot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101c2b"/>
      <stop offset="1" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="gold" x2="1" y2="0">
      <stop stop-color="#ffe2a1"/>
      <stop offset="1" stop-color="#f4b957"/>
    </linearGradient>
    <radialGradient id="radar">
      <stop stop-color="#53dce8" stop-opacity=".16"/>
      <stop offset="1" stop-color="#53dce8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8d9ef" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="url(#bg)" stroke="#283b50"/>
  <rect x="2" y="2" width="1276" height="316" rx="23" fill="url(#grid)"/>
  <path d="M32 39H1248" stroke="#283b50"/>
  <g fill="#7b92a8">
    <circle cx="33" cy="22" r="3"/>
    <circle cx="47" cy="22" r="3"/>
    <circle cx="61" cy="22" r="3"/>
  </g>
  <text x="83" y="26" font-family="monospace" font-size="11" letter-spacing="2" fill="#92a8bc">LOCAL SIGNAL / CLEAR EVIDENCE</text>
  <text x="1248" y="26" text-anchor="end" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#53dce8">MAIL DELIVERY DIAGNOSTICS</text>
  <g transform="translate(158 174)">
    <circle r="105" fill="url(#radar)"/>
    <g fill="none" stroke="#53dce8">
      <circle r="89" stroke-opacity=".6"/>
      <circle r="60" stroke-opacity=".3"/>
      <circle r="30" stroke-opacity=".25"/>
      <path d="M-100 0H100M0-100V100" stroke-opacity=".2"/>
      <path d="M0 0L58-68A89 89 0 0 1 88-13Z" fill="#53dce8" fill-opacity=".08" stroke="none"/>
      <path d="M0 0L58-68" stroke-width="2"/>
    </g>
    <circle cx="36" cy="-43" r="11" fill="none" stroke="#f4bf64" stroke-opacity=".3"/>
    <circle cx="36" cy="-43" r="4" fill="#f4bf64"/>
    <circle cx="-48" cy="22" r="3" fill="#53dce8"/>
    <circle r="5" fill="#53dce8"/>
    <path d="M-99-71V-99H-71M71 99H99V71" fill="none" stroke="#53dce8" stroke-opacity=".5"/>
  </g>
  <text x="302" y="139" fill="url(#gold)" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="68" font-weight="700" letter-spacing="4">MAILRADAR</text>
  <text x="307" y="180" fill="#e1eaf3" font-family="'DejaVu Sans',Arial,sans-serif" font-size="25" font-weight="600">Follow the evidence.</text>
  <text x="307" y="211" fill="#9bb0c5" font-family="'DejaVu Sans',Arial,sans-serif" font-size="17">Find the hop. Read the reason. Know the boundary.</text>
  <g font-family="monospace" font-size="13" letter-spacing="1" text-anchor="middle">
    <rect x="307" y="241" width="160" height="32" rx="8" fill="#122c38" stroke="#24525e"/>
    <text x="387" y="262" fill="#53dce8">MAIL-IN-A-BOX</text>
    <rect x="479" y="241" width="112" height="32" rx="8" fill="#122331" stroke="#2b4157"/>
    <text x="535" y="262" fill="#bdd0df">POSTFIX</text>
    <rect x="603" y="241" width="112" height="32" rx="8" fill="#122331" stroke="#2b4157"/>
    <text x="659" y="262" fill="#bdd0df">DOVECOT</text>
  </g>
  <path d="M907 88V271" stroke="#283b50"/>
  <g font-family="monospace">
    <text x="951" y="107" font-size="11" letter-spacing="2" fill="#7e98af">INVESTIGATION PATH</text>
    <path d="M963 138V238" stroke="#2b5866" stroke-width="2"/>
    <g fill="#101c2b" stroke="#53dce8" stroke-width="2">
      <circle cx="963" cy="140" r="5"/>
      <circle cx="963" cy="189" r="5"/>
      <circle cx="963" cy="238" r="5"/>
    </g>
    <g fill="#d0deea" font-size="17">
      <text x="985" y="146">QUEUE</text>
      <text x="985" y="195">DELIVERY PATH</text>
      <text x="985" y="244">EVIDENCE</text>
    </g>
  </g>
</svg>
